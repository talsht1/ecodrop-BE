services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecodrop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecodrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ecodrop']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecodrop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecodrop
      CORS_ORIGIN: '*'
      REPORT_TARGET_EMAIL: ${REPORT_TARGET_EMAIL:-}
      REPORT_FROM_EMAIL: ${REPORT_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
